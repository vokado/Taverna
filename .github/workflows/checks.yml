name: Проверки внутренней сборки
on:
  push:
    branches: ['develop/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check app/backend tests
      - run: npm ci
        working-directory: app/web
      - run: npm run build
        working-directory: app/web
      - run: npx playwright install chromium
        working-directory: app/web
      - run: npm run test:e2e
        working-directory: app/web
      - if: runner.os == 'Windows'
        run: ./packaging/build_windows.ps1
        shell: pwsh
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Taverna-Internal-Windows-x64
          path: dist/Taverna-Internal-Windows-x64.zip
