name: Проверки внутренней сборки
on:
  push:
    branches: ['develop/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - name: Windows command-kernel preflight
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_plugin_command_worker.py
      - run: python -m pytest -q
      - run: python -m ruff check app/backend tests
      - run: npm ci
        working-directory: app/web
      - run: npm run build
        working-directory: app/web
      - run: npx playwright install chromium
        working-directory: app/web
      - name: Prepare development-only EPUB validator and reader
        run: python scripts/prepare_epub_tools.py
      - run: npm run test:e2e
        working-directory: app/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Browser-failure-${{ matrix.os }}
          path: app/web/test-results/
      - if: runner.os == 'Windows'
        name: Parse Windows test-kit scripts
        shell: pwsh
        run: |
          Get-ChildItem docs/testing/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - if: runner.os == 'Windows'
        run: ./packaging/build_windows.ps1
        shell: pwsh
      - if: runner.os == 'Windows'
        run: python packaging/smoke_frozen.py
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Taverna-Internal-Windows-x64
          path: dist/Taverna-Internal-Windows-x64.zip
