[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taverna"
version = "0.1.0.dev1"
description = "Локальная Таверна — внутренняя разработка полного релиза 1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "portalocker>=3,<4", "jsonschema>=4.23,<5", "pillow>=11,<13", "tinytag==2.3.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
taverna = "taverna.launcher:main"

[tool.setuptools.packages.find]
where = ["app/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
